name: Build, Attest, and Release

# Releases automatically when the version in manifest.json is bumped on main.
# manifest.json is the source of truth: its version becomes the release tag, which
# is what Obsidian (and BRAT) read. No manual tagging required.
on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

jobs:
  # Decide whether this push introduced a new, not-yet-released version.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Guard: manifest.json and package.json must declare the same version, so a
      # release is never cut with mismatched metadata. Fails the run on any drift.
      - name: Verify manifest.json and package.json versions match
        run: |
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch: manifest.json is $MANIFEST_VERSION but package.json is $PACKAGE_VERSION. Bump both to the same version."
            exit 1
          fi
          echo "Versions match: $MANIFEST_VERSION"

      # Skip if this version already has a release, so re-runs and unrelated
      # manifest.json edits (e.g. a description tweak) never attempt a duplicate.
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is not released yet — proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # Required for attestation signing
      contents: write      # Required to create the GitHub Release (and tag)
      attestations: write  # Required to write the attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Set up the Node.js environment on the GitHub server
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'       # Automatically caches dependencies to make future builds faster

      # Step 2: Install plugin's dependencies
      - name: Install dependencies
        run: npm ci

      # Step 3: Run npm build command
      - name: Build plugin
        run: npm run build

      # Step 4: Attest the files generated by build script
      - name: Attest plugin files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Step 5: Extract release notes from CHANGELOG.md for this version
      - name: Extract release notes
        id: changelog
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NOTES=$(awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 6: Create the GitHub Release (creates the tag at this commit) and
      # attach the attested files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            main.js
            manifest.json
            styles.css

      # Step 7: Verify each attested file's provenance before finishing, so a
      # genuine digest/signature mismatch fails the run loudly and a transient
      # indexing lag is retried here instead of surfacing as an external report.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in main.js manifest.json styles.css; do
            echo "::group::Verifying $f"
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then
                echo "$f verified on attempt $attempt"
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::Attestation verification failed for $f after $attempt attempts."
                exit 1
              fi
              echo "Attestation for $f not verifiable yet (attempt $attempt) — retrying in 15s to allow indexing…"
              sleep 15
            done
            echo "::endgroup::"
          done
